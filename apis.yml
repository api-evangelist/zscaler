aid: zscaler
name: Zscaler
description: >-
  Zscaler is a cloud security platform delivering Zero Trust Exchange services
  including Zscaler Internet Access (ZIA), Zscaler Private Access (ZPA), and
  Zscaler Digital Experience (ZDX). Zscaler exposes REST APIs across its
  product suite for configuration, policy management, and reporting,
  authenticated via API keys, OAuth 2.0, or session-based authentication
  depending on the product and cloud (zsapi).
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Cloud Security
  - Zero Trust
  - SASE
  - Network Security
  - SWG
